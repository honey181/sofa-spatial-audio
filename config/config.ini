[SpatialAudio]
# Path to your SOFA file (.sofa)
# default_kemar.sofa: Universal reference standard (dense spherical measurement, smooth 3D response)
# custom_individualized.sofa: Individualized ear-measurement SOFA dataset
sofa_file = C:\ProgramData\SofaSpatialAudio\default_kemar.sofa

[HeadphoneEQ]
# Option 1: Path to your headphone impulse response WAV file (e.g. measured with in-ear mics or exported from AutoEq)
# Supports 16-bit, 24-bit, and 32-bit float stereo or mono WAVs
ir_wav_file = 

# Option 2: Path to an AutoEq parametric text file (e.g. "ParametricEQ.txt")
autoeq_txt_file = 

# Pre-bake headphone EQ into SOFA HRIRs in memory at startup (Zero extra CPU usage during playback)
prebake_eq = true

[Acoustics]
# Master volume trim in dB (-12.0 to +12.0)
master_gain_db = 0.0

# Near-field crossfeed blend (0.0 = pure binaural separation, 0.3 = gentle speaker-like crossfeed)
crossfeed = 0.0
